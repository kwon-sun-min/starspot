apiVersion: v1
kind: ConfigMap
metadata:
  name: starspot-config
  namespace: starspot
data:
  TZ: "Asia/Seoul"
  LOG_LEVEL: "INFO"
  REDIS_URL: "redis://redis:6379/0"
  # DB 접속 문자열: 비밀번호는 Secret 에서 주입되므로 여기엔 호스트/DB만 (실제 조립은 Deployment env 에서)
  DB_HOST: "postgis"
  DB_PORT: "5432"
  DB_NAME: "starspot"
---
# 실제 시크릿 값은 커밋하지 않는다. 아래는 키 이름만 보여주는 템플릿이며,
# 배포 시 `kubectl create secret` 또는 SealedSecret/ExternalSecrets 로 생성한다.
#
#   kubectl -n starspot create secret generic starspot-secret \
#     --from-literal=POSTGRES_USER=starspot \
#     --from-literal=POSTGRES_PASSWORD='<CHANGE_ME>' \
#     --from-literal=KMA_SERVICE_KEY='<CHANGE_ME>' \
#     --from-literal=KAKAO_MAP_KEY='<CHANGE_ME>'
apiVersion: v1
kind: Secret
metadata:
  name: starspot-secret
  namespace: starspot
type: Opaque
stringData:
  POSTGRES_USER: "starspot"
  POSTGRES_PASSWORD: "CHANGE_ME"
  KMA_SERVICE_KEY: ""
  KAKAO_MAP_KEY: ""
