# 모니터링 오버레이: Prometheus + Grafana 를 함께 띄운다.
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# 대시보드: http://localhost:3000 (admin / admin), Prometheus: http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: starspot-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    container_name: starspot-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
